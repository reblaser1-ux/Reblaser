<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תכשיטים בעבודת יד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161513; --muted:#8c877e; --line:#e4e0d8; --cream:#fbfaf7;
    --card:#ffffff; --danger:#8c3b2c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Assistant',system-ui,sans-serif;font-weight:300;}
  h1,h2{font-family:'Cormorant Garamond',serif;font-weight:500;}
  header{padding:56px 20px 34px;text-align:center;border-bottom:1px solid var(--line);}
  h1{font-size:2.6rem;margin:0 0 10px;letter-spacing:2px;}
  .tagline{color:var(--muted);font-size:.85rem;margin:0;letter-spacing:2px;text-transform:uppercase;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px 70px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);margin-top:1px;border:1px solid var(--line);}
  .card{background:var(--card);overflow:hidden;display:flex;flex-direction:column;position:relative;}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0ede6;}
  .card .body{padding:22px 20px 26px;display:flex;flex-direction:column;gap:8px;flex:1;text-align:center;}
  .card h3{margin:0;font-size:1.15rem;font-weight:400;font-family:'Cormorant Garamond',serif;}
  .card .price{font-size:.95rem;letter-spacing:1px;}
  .card .desc{color:var(--muted);font-size:.85rem;flex:1;line-height:1.5;}
  .oos{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--cream);font-size:.65rem;letter-spacing:1px;padding:4px 10px;text-transform:uppercase;}
  .btn{display:inline-block;text-align:center;padding:12px 16px;border:1px solid var(--ink);cursor:pointer;font-size:.75rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;color:var(--ink);background:transparent;}
  .btn-order[disabled]{opacity:.35;pointer-events:none;}
  .btn-gold{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .btn-danger{border-color:var(--danger);color:var(--danger);}
  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-family:'Cormorant Garamond',serif;font-size:1.3rem;}
  #admin-toggle{position:fixed;bottom:16px;left:16px;z-index:50;font-size:.7rem;letter-spacing:1px;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:7px 14px;text-transform:uppercase;cursor:pointer;}
  #admin-panel{display:none;background:var(--card);padding:30px;margin-top:50px;border:1px solid var(--line);max-width:1100px;margin-inline:auto;}
  #admin-panel.open{display:block;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
  .field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-family:'Assistant',sans-serif;}
  .admin-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .admin-item img{width:44px;height:44px;object-fit:cover;}
  .admin-item .name{flex:1;font-size:.9rem;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:120px;}
  .status{font-size:.8rem;color:var(--muted);margin-top:10px;min-height:1em;}
  hr{border:none;border-top:1px solid var(--line);margin:26px 0;}
  .card img{cursor:pointer;}
  .thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .thumbs img{width:36px;height:36px;object-fit:cover;border:1px solid var(--line);}
  .admin-thumb{position:relative;display:inline-block;}
  .admin-thumb button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:.7rem;line-height:1;cursor:pointer;}
  #detailOverlay{display:none;position:fixed;inset:0;background:rgba(20,18,14,.85);z-index:100;align-items:center;justify-content:center;padding:20px;}
  #detailOverlay.open{display:flex;}
  #detailBox{background:var(--card);max-width:700px;width:100%;max-height:90vh;overflow:auto;position:relative;}
  #detailClose{position:absolute;top:10px;left:10px;background:var(--card);border:1px solid var(--line);width:32px;height:32px;cursor:pointer;font-size:1rem;z-index:2;}
  #detailGallery{position:relative;background:#f0ede6;}
  #detailGallery img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
  .gnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;width:36px;height:36px;cursor:pointer;font-size:1.1rem;}
  .gnav.prev{right:10px;} .gnav.next{left:10px;}
  #detailDots{display:flex;gap:6px;justify-content:center;padding:10px;}
  #detailDots span{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;}
  #detailDots span.active{background:var(--ink);}
  #detailBody{padding:26px;text-align:center;}
  #detailBody h2{font-size:1.6rem;margin:0 0 8px;}
</style>
</head>
<body>
<header>
  <h1 id="siteName">תכשיטים בעבודת יד</h1>
  <p class="tagline" id="tagline">כל פריט מיוצר ביד, באהבה ובדיוק</p>
</header>
<div class="wrap">
  <div id="grid" class="grid"></div>
  <div id="emptyMsg" class="empty" style="display:none;">עדיין אין מוצרים להצגה.</div>
</div>

<div id="detailOverlay">
  <div id="detailBox">
    <button id="detailClose">✕</button>
    <div id="detailGallery">
      <img id="detailImg" src="" alt="">
      <button class="gnav prev" id="galPrev">›</button>
      <button class="gnav next" id="galNext">‹</button>
    </div>
    <div id="detailDots"></div>
    <div id="detailBody">
      <h2 id="detailName"></h2>
      <div class="price" id="detailPrice"></div>
      <p class="desc" id="detailDesc"></p>
      <a class="btn btn-gold" id="detailOrder" target="_blank">הזמנה בוואטסאפ</a>
    </div>
  </div>
</div>

<button id="admin-toggle">כניסת מנהל/ת</button>
<div id="admin-panel">
  <div id="loginBox">
    <h2>כניסה</h2>
    <div class="field"><label>אימייל</label><input id="login-email" type="email"></div>
    <div class="field"><label>סיסמה</label><input id="login-pass" type="password"></div>
    <button class="btn btn-gold" id="loginBtn">התחבר</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="adminBox" style="display:none;">
    <div class="row" style="justify-content:space-between;">
      <h2>ניהול האתר</h2>
      <button class="btn" id="logoutBtn" style="max-width:120px;">התנתק</button>
    </div>
    <div class="field"><label>שם העסק</label><input id="in-siteName"></div>
    <div class="field"><label>כיתוב קצר</label><input id="in-tagline"></div>
    <div class="field"><label>מספר וואטסאפ (972501234567)</label><input id="in-whatsapp"></div>
    <button class="btn btn-gold" id="saveSettings">שמור הגדרות</button>
    <hr>
    <h2 id="formTitle">הוספת מוצר</h2>
    <div class="row">
      <div class="field"><label>שם המוצר</label><input id="p-name"></div>
      <div class="field"><label>מחיר (₪)</label><input id="p-price" type="number"></div>
    </div>
    <div class="field"><label>תיאור</label><textarea id="p-desc"></textarea></div>
    <div class="field"><label>תמונות (אפשר לבחור כמה יחד)</label><input id="p-image" type="file" accept="image/*" multiple></div>
    <div id="existingImages" class="thumbs"></div>
    <div class="row">
      <button class="btn btn-gold" id="saveProduct">הוסף מוצר</button>
      <button class="btn" id="cancelEdit" style="display:none;">ביטול עריכה</button>
    </div>
    <hr>
    <h2>מוצרים קיימים</h2>
    <div id="admin-list"></div>
    <div class="status" id="statusMsg"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ⚠️ מלא כאן את הפרטים מהפרויקט שלך ב-Supabase (Project Settings > API)
const SUPABASE_URL = 'https://cdmbnxiddtwbtbehhseh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkbWJueGlkZHR3YnRiZWhoc2VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTkxMjksImV4cCI6MjEwNjA5NTEyOX0.oSV-FHXqFJGQTLH-BlewJ7PG04K3HF5OXFAcnJt081Y';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let products = [];
let settings = { site_name: 'תכשיטים בעבודת יד', tagline: '', whatsapp: '' };
let editingId = null;
let session = null;

async function loadPublicData(){
  const { data: prods } = await supabase.from('products').select('*').order('created_at', { ascending:false });
  products = prods || [];
  const { data: s } = await supabase.from('site_settings').select('*').eq('id',1).single();
  if (s) settings = s;
  renderPublic();
}

function renderPublic(){
  document.getElementById('siteName').textContent = settings.site_name || 'תכשיטים בעבודת יד';
  document.getElementById('tagline').textContent = settings.tagline || '';
  document.title = settings.site_name || 'תכשיטים בעבודת יד';

  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  grid.innerHTML = '';
  emptyMsg.style.display = products.length ? 'none' : 'block';

  products.forEach(p=>{
    const card = document.createElement('div'); card.className='card';
    const thumb = (p.images && p.images[0]) || p.image_url || '';
    const waText = encodeURIComponent('שלום! מעוניין/ת להזמין: ' + p.name + (p.price? (' (' + p.price + ' ₪)') : ''));
    const waLink = settings.whatsapp ? ('https://wa.me/' + settings.whatsapp + '?text=' + waText) : '#';
    card.innerHTML = `
      ${p.in_stock===false?'<span class="oos">אזל מהמלאי</span>':''}
      <img src="${thumb}" alt="${p.name}" data-open="${p.id}">
      <div class="body">
        <h3 data-open="${p.id}" style="cursor:pointer;">${p.name}</h3>
        ${p.price?`<div class="price">${p.price} ₪</div>`:''}
        <div class="desc">${p.description||''}</div>
        <a class="btn btn-order" ${p.in_stock===false||!settings.whatsapp?'disabled':''} href="${waLink}" target="_blank">הזמנה בוואטסאפ</a>
      </div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open));
}

let galImages = [];
let galIndex = 0;

function openDetail(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  galImages = (p.images && p.images.length) ? p.images : (p.image_url ? [p.image_url] : []);
  galIndex = 0;
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailPrice').textContent = p.price ? (p.price + ' ₪') : '';
  document.getElementById('detailDesc').textContent = p.description || '';
  const waText = encodeURIComponent('שלום! מעוניין/ת להזמין: ' + p.name + (p.price? (' (' + p.price + ' ₪)') : ''));
  const order = document.getElementById('detailOrder');
  if (settings.whatsapp && p.in_stock !== false){
    order.href = 'https://wa.me/' + settings.whatsapp + '?text=' + waText;
    order.style.display = 'inline-block';
  } else { order.style.display = 'none'; }
  renderGallery();
  document.getElementById('detailOverlay').classList.add('open');
}
function renderGallery(){
  const dots = document.getElementById('detailDots');
  document.getElementById('detailImg').src = galImages[galIndex] || '';
  dots.innerHTML = '';
  const nav = galImages.length > 1;
  document.getElementById('galPrev').style.display = nav ? 'block':'none';
  document.getElementById('galNext').style.display = nav ? 'block':'none';
  galImages.forEach((_,i)=>{
    const d = document.createElement('span');
    if (i===galIndex) d.className='active';
    d.onclick = ()=>{ galIndex=i; renderGallery(); };
    dots.appendChild(d);
  });
}
document.getElementById('galPrev').onclick = ()=>{ galIndex = (galIndex+1) % galImages.length; renderGallery(); };
document.getElementById('galNext').onclick = ()=>{ galIndex = (galIndex-1+galImages.length) % galImages.length; renderGallery(); };
document.getElementById('detailClose').onclick = ()=> document.getElementById('detailOverlay').classList.remove('open');
document.getElementById('detailOverlay').onclick = (e)=>{ if(e.target.id==='detailOverlay') e.currentTarget.classList.remove('open'); };

function renderAdmin(){
  document.getElementById('in-siteName').value = settings.site_name||'';
  document.getElementById('in-tagline').value = settings.tagline||'';
  document.getElementById('in-whatsapp').value = settings.whatsapp||'';
  const list = document.getElementById('admin-list');
  list.innerHTML = '';
  products.forEach(p=>{
    const row = document.createElement('div'); row.className='admin-item';
    row.innerHTML = `<img src="${(p.images&&p.images[0])||p.image_url||''}"><div class="name">${p.name} ${p.price?('· '+p.price+' ₪'):''}</div>
      <button class="btn" data-edit="${p.id}">ערוך</button>
      <button class="btn" data-toggle="${p.id}">${p.in_stock===false?'סמן במלאי':'סמן אזל'}</button>
      <button class="btn btn-danger" data-del="${p.id}">מחק</button>`;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));
  list.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleStock(b.dataset.toggle));
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.del));
}

let currentEditImages = [];

function startEdit(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  document.getElementById('p-name').value = p.name||'';
  document.getElementById('p-price').value = p.price||'';
  document.getElementById('p-desc').value = p.description||'';
  document.getElementById('p-image').value = '';
  currentEditImages = (p.images && p.images.length) ? [...p.images] : (p.image_url ? [p.image_url] : []);
  renderExistingImages();
  document.getElementById('formTitle').textContent = 'עריכת מוצר';
  document.getElementById('saveProduct').textContent = 'עדכן מוצר';
  document.getElementById('cancelEdit').style.display = 'inline-block';
}
function renderExistingImages(){
  const box = document.getElementById('existingImages');
  box.innerHTML = '';
  currentEditImages.forEach((url,i)=>{
    const wrap = document.createElement('span'); wrap.className='admin-thumb';
    wrap.innerHTML = `<img src="${url}"><button data-rm="${i}">✕</button>`;
    box.appendChild(wrap);
  });
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    currentEditImages.splice(Number(b.dataset.rm),1);
    renderExistingImages();
  });
}
function resetForm(){
  editingId = null;
  currentEditImages = [];
  document.getElementById('existingImages').innerHTML = '';
  document.getElementById('p-name').value='';
  document.getElementById('p-price').value='';
  document.getElementById('p-desc').value='';
  document.getElementById('p-image').value='';
  document.getElementById('formTitle').textContent = 'הוספת מוצר';
  document.getElementById('saveProduct').textContent = 'הוסף מוצר';
  document.getElementById('cancelEdit').style.display = 'none';
}
document.getElementById('cancelEdit').onclick = resetForm;

async function uploadImage(file){
  const ext = file.name.split('.').pop();
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await supabase.storage.from('product-images').upload(path, file);
  if (error) throw error;
  const { data } = supabase.storage.from('product-images').getPublicUrl(path);
  return data.publicUrl;
}
async function uploadImages(files){
  const urls = [];
  for (const file of files) urls.push(await uploadImage(file));
  return urls;
}

document.getElementById('saveProduct').onclick = async ()=>{
  const s = document.getElementById('statusMsg');
  const name = document.getElementById('p-name').value.trim();
  const price = document.getElementById('p-price').value.trim() || null;
  const description = document.getElementById('p-desc').value.trim();
  const files = document.getElementById('p-image').files;
  if(!name){ s.textContent = 'יש להזין שם מוצר'; return; }
  s.textContent = 'שומר...';
  try{
    let newUrls = [];
    if(files.length) newUrls = await uploadImages(files);
    if(editingId){
      const images = [...currentEditImages, ...newUrls];
      const patch = { name, price, description, images };
      if(images[0]) patch.image_url = images[0];
      const { error } = await supabase.from('products').update(patch).eq('id', editingId);
      if (error) throw error;
      s.textContent = 'המוצר עודכן ✓';
    } else {
      const images = newUrls;
      const { error } = await supabase.from('products').insert({ name, price, description, images, image_url: images[0]||null, in_stock:true });
      if (error) throw error;
      s.textContent = 'המוצר נוסף ✓';
    }
    resetForm();
    await loadPublicData();
    renderAdmin();
  }catch(e){
    s.textContent = 'שגיאה: ' + e.message;
  }
};

async function toggleStock(id){
  const p = products.find(x=>x.id===id);
  await supabase.from('products').update({ in_stock: p.in_stock===false }).eq('id', id);
  await loadPublicData(); renderAdmin();
}
async function deleteProduct(id){
  await supabase.from('products').delete().eq('id', id);
  await loadPublicData(); renderAdmin();
}

document.getElementById('saveSettings').onclick = async ()=>{
  const s = document.getElementById('statusMsg');
  const patch = {
    site_name: document.getElementById('in-siteName').value.trim(),
    tagline: document.getElementById('in-tagline').value.trim(),
    whatsapp: document.getElementById('in-whatsapp').value.trim().replace(/\D/g,'')
  };
  const { error } = await supabase.from('site_settings').update(patch).eq('id',1);
  s.textContent = error ? ('שגיאה: '+error.message) : 'ההגדרות נשמרו ✓';
  await loadPublicData(); renderAdmin();
};

// --- auth ---
document.getElementById('admin-toggle').onclick = ()=>{
  document.getElementById('admin-panel').classList.toggle('open');
};
document.getElementById('loginBtn').onclick = async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  document.getElementById('loginStatus').textContent = error ? error.message : '';
  if (!error){ session = data.session; showAdmin(); }
};
document.getElementById('logoutBtn').onclick = async ()=>{
  await supabase.auth.signOut();
  session = null;
  document.getElementById('loginBox').style.display='block';
  document.getElementById('adminBox').style.display='none';
};
function showAdmin(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
  renderAdmin();
}

(async ()=>{
  const { data:{ session: s } } = await supabase.auth.getSession();
  session = s;
  await loadPublicData();
  if (session) showAdmin();
})();
</script>
</body>
</html>
